<svg xmlns="http://www.w3.org/2000/svg" width="312" height="378.932" viewBox="0 0 312 378.932">
  <g id="グループ_7141" data-name="グループ 7141" transform="translate(-29 -603.068)">
    <text id="_オンライン面談で使用するアプリについては日程確定時にご案内いたします_データマッチングの検索結果には_個人を特定する情報は含まれません_もちろんその場で入会を決めていただく必要はありません_ご納得いただけるまでご検討ください_" data-name="※オンライン面談で使用するアプリについては日程確定時にご案内いたします。
※データマッチングの検索結果には、個人を特定する情報は含まれません。
※もちろんその場で入会を決めていただく必要はありません。ご納得いただけるまでご検討ください。" transform="translate(29 892)" fill="#333" font-size="10" font-family="NotoSansJP-Regular, Noto Sans JP"><tspan x="0" y="12">※オンライン面談で使用するアプリについては日程確定時にご案内い</tspan><tspan x="0" y="27">たします。</tspan><tspan x="0" y="42">※データマッチングの検索結果には、個人を特定する情報は含まれま</tspan><tspan x="0" y="57">せん。</tspan><tspan x="0" y="72">※もちろんその場で入会を決めていただく必要はありません。ご納得</tspan><tspan x="0" y="87">いただけるまでご検討ください。</tspan></text>
    <g id="グループ_2961" data-name="グループ 2961">
      <text id="日程確定のご連絡" transform="translate(71 607)" fill="#b19d7f" font-size="14" font-family="NotoSansJP-Bold, Noto Sans JP" font-weight="700" letter-spacing="0.05em"><tspan x="0" y="16">日程確定のご連絡</tspan></text>
      <text id="ご面談の実施" transform="translate(71 686)" fill="#b19d7f" font-size="14" font-family="NotoSansJP-Bold, Noto Sans JP" font-weight="700" letter-spacing="0.05em"><tspan x="0" y="16">ご面談の実施</tspan></text>
      <text id="ご来店で無料マッチング体験も実施中" transform="translate(71 790)" fill="#b19d7f" font-size="14" font-family="NotoSansJP-Bold, Noto Sans JP" font-weight="700" letter-spacing="0.05em"><tspan x="0" y="16">ご来店で無料マッチング体験も実施中</tspan></text>
      <text id="担当者より日程確定_および面談への参加方法をお知らせいたします_" data-name="担当者より日程確定・および面談への参加方法をお知らせいたします。" transform="translate(71 632)" fill="#333" font-size="12" font-family="NotoSansJP-Regular, Noto Sans JP"><tspan x="0" y="14">担当者より日程確定・および面談への参加方法を</tspan><tspan x="0" y="34">お知らせいたします。</tspan></text>
      <text id="担当者とご来店時同様の面談を行います_結婚相談所のことや当会のサービス内容を丁寧にご説明いたします_" data-name="担当者とご来店時同様の面談を行います。
結婚相談所のことや当会のサービス内容を丁寧にご説明いたします。" transform="translate(71 711)" fill="#333" font-size="12" font-family="NotoSansJP-Regular, Noto Sans JP"><tspan x="0" y="14">担当者とご来店時同様の面談を行います。</tspan><tspan x="0" y="34">結婚相談所のことや当会のサービス内容を丁寧に</tspan><tspan x="0" y="54">ご説明いたします。</tspan></text>
      <text id="さらに1度ご来店いただけますと_お相手への希望条件を元に無料でデータマッチング結果もご案内します_" data-name="さらに1度ご来店いただけますと、お相手への希望条件を元に無料でデータマッチング結果もご案内します。" transform="translate(71 815)" fill="#333" font-size="12" font-family="NotoSansJP-Regular, Noto Sans JP"><tspan x="0" y="14">さらに1度ご来店いただけますと、お相手への希</tspan><tspan x="0" y="34">望条件を元に無料でデータマッチング結果もご案</tspan><tspan x="0" y="54">内します。</tspan></text>
    </g>
